[project]
name = "chips"
version = "0.1.0"
description = "CHIPS CORTEX — deterministic engineering cognition infrastructure"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "gitpython>=3.1",
    "mcp>=1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tiktoken>=0.13.0",
    "flashrank>=0.2.10",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "prometheus-client>=0.23.1",
    "opentelemetry-distro>=0.59b0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-instrumentation-psycopg>=0.59b0",
    "duckdb>=1.4.2",
    "vulture>=2.16",
    "griffe>=2.0.2",
    "pyrefly>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-postgresql>=6.1",
    "testcontainers[postgres]>=4.9",
    "coverage>=7.0",
    "hypothesis>=6.148.2",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["src/chips"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "hypothesis>=6.148.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "testcontainers>=4.14.2",
]
