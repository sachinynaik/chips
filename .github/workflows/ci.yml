# Two-pass CI (see wsl-docker-setup/docs/2-local-ci.md):
#  - LOCAL  first pass: the pre-push git hook runs this via `act`/`actgpu` before every push.
#  - REMOTE second pass: GitHub dispatches it to the self-hosted runner [self-hosted, gpu].
# Make it a merge gate: repo Settings -> Branches -> require the `build` check.
#
# Faithful env via `uv sync` (uv.lock). Postgres provided as a service container;
# the DB endpoint differs between act (job runs in a container -> service name
# `postgres`, container port 5432) and the self-hosted runner (-> localhost via the
# host-mapped port), so we resolve it at runtime. The host mapping is 55432, NOT
# 5432: the runner's Docker host is shared (other projects own :5432) and probing
# the default port could reach a foreign database.
name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: [self-hosted, gpu]   # under act -> catthehacker/ubuntu:act-latest (~/.actrc)
    env:
      # Force POSIX temp dir — act-on-Windows can leak a Windows TEMP into the Linux job.
      TMPDIR: /tmp
      TEMP: /tmp
      TMP: /tmp
      # Faithful env ships the full OTel stack, so the span contract tests must
      # NOT skip here — test_otel_required.py turns any dep drift into a red CI.
      CHIPS_REQUIRE_OTEL: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432   # 55432: shared runner host; :5432 and :5499 are taken
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    steps:
      - uses: actions/checkout@v4

      - name: Persistent flashrank model cache
        # The reranker downloads a ~21.6MB model into ./.flashrank_cache on first
        # use (reranker.py _DEFAULT_CACHE_DIR is CWD-relative). Both CI passes
        # start from a copy WITHOUT it (runner: fresh checkout; act: the repo
        # copy excludes gitignored files), so every run re-downloads — and the
        # download flakes whenever WSL egress to the HF CDN degrades
        # (2026-07-06, run 28772075937 ×2 + the local act gate). Symlink it to
        # a persistent location instead: under act the toolcache volume
        # (act-toolcache) survives across runs; on the runner, the runner
        # user's home does.
        run: |
          if [ ! -e .flashrank_cache ]; then
            if [ -n "$ACT" ]; then
              target="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/flashrank"
            else
              target="$HOME/.cache/flashrank"
            fi
            mkdir -p "$target"
            ln -s "$target" .flashrank_cache
          fi

      - name: Keep venv out of the checkout path (runner only)
        # A containerized step once left a root-owned .venv inside _work/, and the
        # next checkout's cleanup died on EACCES (2026-07-06, run 28754216463
        # attempt 1). Relocate the runner's venv to a persistent path outside the
        # checkout. Under act the container is ephemeral and the repo-mounted
        # .venv is the warm cache — keep the default there.
        if: ${{ !env.ACT }}
        run: echo "UV_PROJECT_ENVIRONMENT=/tmp/chips-venv" >> "$GITHUB_ENV"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync locked deps (faithful env)
        run: uv sync --extra dev

      - name: Resolve reachable Postgres host
        run: |
          python3 - <<'PY'
          import os, socket
          # Only endpoints that can be OUR service container: the act network
          # alias, or the deliberately non-default host-mapped port. Never probe
          # localhost:5432 -- on the shared runner host that is someone else's DB.
          candidates = (
              ("postgres", 5432),
              ("localhost", 55432),
              ("127.0.0.1", 55432),
          )
          for host, port in candidates:
              try:
                  socket.create_connection((host, port), timeout=3).close()
              except OSError:
                  continue
              url = f"postgresql://postgres:postgres@{host}:{port}/postgres"
              with open(os.environ["GITHUB_ENV"], "a") as fh:
                  fh.write(f"CHIPS_TEST_DB_URL={url}\n")
              print(f"Postgres reachable at {host}:{port}")
              break
          else:
              raise SystemExit(
                  "no Postgres service reachable (tried postgres:5432, localhost:55432)"
              )
          PY

      - name: Migrate test DB to head
        # Some test dirs (tests/unit, tests/compiler) no-op the autouse apply_migrations
        # fixture (mock tests), but their tests still open a real conn. Migrate the shared
        # CI DB once up-front so those tables exist regardless of per-dir overrides.
        run: |
          uv run python - <<'PY'
          import os
          from alembic.config import Config
          from alembic import command
          cfg = Config("alembic.ini")
          url = os.environ["CHIPS_TEST_DB_URL"].replace("postgresql://", "postgresql+psycopg://", 1)
          cfg.set_main_option("sqlalchemy.url", url)
          command.upgrade(cfg, "head")
          print("migrated to head")
          PY

      - name: Run tests
        run: uv run pytest -q
